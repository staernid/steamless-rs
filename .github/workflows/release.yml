name: Release Steamless Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: steamless-linux-x64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: steamless-windows-x64

          - target: i686-pc-windows-msvc
            os: windows-latest
            artifact_name: steamless-windows-x86

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: steamless-macos-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: steamless-macos-arm64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: steamless-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/steamless ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/steamless.exe ${{ matrix.artifact_name }}.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.exe

