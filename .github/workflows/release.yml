name: Release Steamless Engine

on:
  push:
    tags:
      - 'b*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: steamless-linux-x64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: steamless-windows-x64

          - target: i686-pc-windows-msvc
            os: windows-latest
            artifact_name: steamless-windows-x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/steamless dist/
          cp target/${{ matrix.target }}/release/libsteamless_c.so dist/
          cp plugins/lutris/steamless_lutris.py dist/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/${{ matrix.target }}/release/steamless.exe dist/
          Copy-Item target/${{ matrix.target }}/release/steamless_c.dll dist/
          Copy-Item plugins/lutris/steamless_lutris.py dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip

  trigger-copr:
    name: Trigger COPR Package Build
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install copr-cli
        run: pip install copr-cli

      - name: Trigger COPR Build
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [ -n "$COPR_CONFIG" ]; then
            mkdir -p ~/.config
            echo "$COPR_CONFIG" > ~/.config/copr
            copr buildscm --clone-url https://github.com/staernid/steamless-rs.git --commit "$TAG_NAME" --spec packaging/fedora/steamless.spec steamless
          else
            echo "COPR_CONFIG secret not set in repository; skipping remote trigger."
          fi

